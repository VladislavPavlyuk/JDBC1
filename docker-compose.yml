volumes:
  ts-db:

services:
  ts-postgres:
    container_name: jdbc1
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: jdbc1
    volumes:
        - ts-db:/var/lib/postgresql
  #      - ./data:/var/lib/postgresql/data
        - ./Init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5439:5432"
